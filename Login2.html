<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="PE Inventario">
    <title>Inventario Tecnológico - Plomería Eléctrica</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icons/pe-icon.svg">
    <link rel="apple-touch-icon" href="icons/pe-icon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="login2.css">
</head>
<body>

<div class="login-wrap">

    <!-- Decoración fondo -->
    <div class="bg-circle c1"></div>
    <div class="bg-circle c2"></div>

    <div class="login-card">

        <!-- Logo + empresa -->
        <div class="brand">
            <div class="brand-logo">
                <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                    <defs><clipPath id="cf"><rect x="1" y="1" width="62" height="62" rx="10"/></clipPath></defs>
                    <rect x="1" y="1" width="62" height="62" rx="10" fill="#1e1e1e"/>
                    <g clip-path="url(#cf)" stroke="rgba(255,255,255,0.08)" stroke-width="1" fill="none">
                        <line x1="0" y1="8"  x2="64" y2="8"/> <line x1="0" y1="16" x2="64" y2="16"/>
                        <line x1="0" y1="24" x2="64" y2="24"/> <line x1="0" y1="32" x2="64" y2="32"/>
                        <line x1="0" y1="40" x2="64" y2="40"/> <line x1="0" y1="48" x2="64" y2="48"/>
                        <line x1="0" y1="56" x2="64" y2="56"/>
                        <line x1="8"  y1="0" x2="8"  y2="64"/> <line x1="16" y1="0" x2="16" y2="64"/>
                        <line x1="24" y1="0" x2="24" y2="64"/> <line x1="32" y1="0" x2="32" y2="64"/>
                        <line x1="40" y1="0" x2="40" y2="64"/> <line x1="48" y1="0" x2="48" y2="64"/>
                        <line x1="56" y1="0" x2="56" y2="64"/>
                    </g>
                    <rect x="1" y="1" width="62" height="62" rx="10" fill="none" stroke="rgba(255,80,80,0.5)" stroke-width="2"/>
                    <ellipse cx="32" cy="32" r="20" ry="17" fill="#111" stroke="rgba(255,80,80,0.4)" stroke-width="1.5"/>
                    <text x="32" y="39" font-family="Arial Black,Arial,sans-serif" font-size="20" font-weight="900" fill="#e91e8c" text-anchor="middle">PE</text>
                </svg>
            </div>
            <div class="brand-text">
                <span class="brand-name">Plomería Eléctrica</span>
                <span class="brand-sub">de Reynosa, S.A. de C.V.</span>
            </div>
        </div>

        <div class="divider"></div>

        <!-- Títulos -->
        <p class="welcome">Acceso al sistema</p>
        <h1 class="welcome-sub">Iniciar <span>Sesión</span></h1>

        <!-- Formulario -->
        <form id="loginForm">
            <div class="form-group">
                <label>Correo electrónico</label>
                <div class="input-wrap">
                    <i class='bx bx-envelope'></i>
                    <input type="email" id="loginEmail" placeholder="usuario@empresa.com" required autocomplete="email">
                </div>
            </div>

            <div class="form-group">
                <label>Contraseña</label>
                <div class="input-wrap">
                    <i class='bx bx-lock-alt'></i>
                    <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
                    <i class='bx bx-show eye-btn' id="toggleLoginPassword"></i>
                </div>
            </div>

            <div class="form-footer">
                <label class="remember-me">
                    <input type="checkbox" id="rememberMe"> Recordarme
                </label>
            </div>

            <button type="submit" class="btn-login" id="btnLogin">
                <div class="btn-inner">
                    <span class="btn-label">Entrar al sistema</span>
                    <div class="btn-arrow"><i class='bx bx-right-arrow-alt'></i></div>
                </div>
            </button>
        </form>

    </div>
</div>

<script src="api-client.js"></script>
<script src="Java.js"></script>
</body>
</html>
